[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; IMPORTANT: this is still a generic ESP32-S3 PlatformIO board profile.
; Verify flash/PSRAM and every pin against the exact ES3C28P board revision
; and LCDWiki demo before uploading to hardware.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi

; TFT_eSPI + LVGL. Add include/ to the include search path so the LVGL
; library can resolve include/lv_conf.h while compiling its own sources.
lib_deps =
    lvgl/lvgl@8.4.0
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^7.4.2

build_flags =
    -Iinclude
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=16
    ; LoRa UART is deliberately disabled until physical RX/TX wiring is verified.
    ; Set these to safe, verified ESP32-S3 GPIO numbers after wiring the E220/E32.
    -D HHC_LORA_RX_PIN=-1
    -D HHC_LORA_TX_PIN=-1
    -D HHC_LORA_BAUD=9600
