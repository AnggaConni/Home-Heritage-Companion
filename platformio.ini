[env:es3c28p]
platform = espressif32
board = es3c28p
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; LCDWiki ES3C28P: 16 MB flash, 8 MB OPI PSRAM, ILI9341V 240x320.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi

; TFT_eSPI is pinned to upstream Git so ESP32-S3 uses the corrected SPI_PORT
; mapping (SPI_PORT 2) rather than the broken FSPI mapping in v2.5.43.
; LVGL 8.4 remains pinned for API compatibility.
lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/Bodmer/TFT_eSPI.git
    bblanchon/ArduinoJson@^7.4.2
    https://github.com/pschatzmann/arduino-audio-tools.git#main
    https://github.com/pschatzmann/arduino-audio-driver.git#main
    https://github.com/pschatzmann/codec-helix.git#main

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=16
    ; LoRa UART stays disabled until physical RX/TX wiring is verified.
    -D HHC_LORA_RX_PIN=-1
    -D HHC_LORA_TX_PIN=-1
    -D HHC_LORA_BAUD=9600
