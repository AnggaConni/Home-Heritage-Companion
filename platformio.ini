[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; LCDWiki ES3C28P hardware: ILI9341V over SPI.
; This is a generic ESP32-S3 board profile plus explicit TFT pins.
; Validate against the vendor demo for your exact board revision.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi

lib_deps =
    lvgl/lvgl@^8.4.0
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=16
    -D LV_TICK_CUSTOM=1
    -D LV_TICK_CUSTOM_INCLUDE="Arduino.h"
    -D LV_TICK_CUSTOM_SYS_TIME_EXPR=millis
